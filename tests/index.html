<!doctype html><html><head><meta charset="utf-8">
<style>
  body { margin: 0; padding: 16px; font-family: Roboto, "Segoe UI", system-ui, sans-serif; }
  body.dark { background: #111; color: #e1e1e1;
    --primary-text-color:#e1e1e1; --secondary-text-color:#9b9b9b; --ha-card-background:#1c1c1c; --card-background-color:#1c1c1c;
    --divider-color: rgba(225,225,225,.12); --primary-color:#03a9f4; --accent-color:#ff9800; }
  body.light { background: #fafafa; color: #212121;
    --primary-text-color:#212121; --secondary-text-color:#727272; --ha-card-background:#fff; --card-background-color:#fff;
    --divider-color: rgba(0,0,0,.12); --primary-color:#03a9f4; --accent-color:#ff9800; }
  .grid { display: grid; grid-template-columns: repeat(2, 460px); gap: 16px; align-items: start; }
</style>
<script>
  // Minimal stand-ins for HA's built-in elements.
  customElements.define("ha-card", class extends HTMLElement {
    connectedCallback() { Object.assign(this.style, { display: "block", background: "var(--ha-card-background)", borderRadius: "12px",
      border: "1px solid var(--divider-color)", color: "var(--primary-text-color)" }); } });
  customElements.define("ha-icon", class extends HTMLElement {
    connectedCallback() { Object.assign(this.style, { display: "inline-block", width: "var(--mdc-icon-size, 24px)",
      height: "var(--mdc-icon-size, 24px)", borderRadius: "50%", background: "currentColor", opacity: ".35" }); } });
</script>
<script type="module" src="../saft-packs-card.js"></script>
</head><body class="dark"><div class="grid" id="g"></div>
<script type="module">
  const theme = new URLSearchParams(location.search).get("theme") || "dark";
  document.body.className = theme;
  const [states, cards] = await Promise.all([fetch(new URLSearchParams(location.search).get("states") || "states.json").then(r => r.json()), fetch("cards.json").then(r => r.json())]);
  window.__events = [];
  window.addEventListener("hass-more-info", e => window.__events.push(e.detail.entityId));
  await customElements.whenDefined("saft-packs-card");
  const hass = { states, entities: {} };
  window.__cards = [];
  for (const cfg of cards) {
    const el = document.createElement(cfg.type.replace("custom:", ""));
    el.setConfig(cfg); el.hass = hass;
    document.getElementById("g").appendChild(el); window.__cards.push(el);
  }
  window.__ready = true;
</script></body></html>
